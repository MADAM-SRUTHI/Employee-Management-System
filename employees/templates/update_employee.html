<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 35px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: 650px;
            max-width: 92%;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            background: #6b7280;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 6px;
        }

        button:hover {
            background: #d97706;
        }

        .back:hover {
            background: #4b5563;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>👨‍💼 Employee Management System</h1>
    </div>

    <div class="container">

        <div class="form-box">

            <h2>✏️ Update Employee</h2>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Employee ID</label>

                    <input
                        type="text"
                        name="employee_id"
                        value="{{ employee.employee_id }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        value="{{ employee.name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ employee.email }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ employee.phone }}"
                        maxlength="15"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Department</label>

                    <input
                        type="text"
                        name="department"
                        value="{{ employee.department }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Position</label>

                    <input
                        type="text"
                        name="position"
                        value="{{ employee.position }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Salary</label>

                    <input
                        type="number"
                        name="salary"
                        value="{{ employee.salary }}"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Joining Date</label>

                    <input
                        type="date"
                        name="joining_date"
                        value="{{ employee.joining_date|date:'Y-m-d' }}"
                        required
                    >
                </div>

                <div class="buttons">

                    <button type="submit">
                        Update Employee
                    </button>

                    <a
                        href="{% url 'dashboard' %}"
                        class="back"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
